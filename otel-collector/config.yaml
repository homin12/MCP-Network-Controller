receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlphttp/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true

  prometheus:
    endpoint: "0.0.0.0:8889"

  debug:
    verbosity: basic

service:
  pipelines:
    logs:
      receivers: [otlp]        
      processors: [batch]
      exporters: [otlphttp/loki, debug]
      
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
